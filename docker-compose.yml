services:
  ia-consciente:
    build: .
    ports:
      - 3000
    environment:
      # O Prisma CLI resolve este caminho dentro de /app/prisma.
      DATABASE_URL: file:./data/dev.db
    volumes:
      # O banco continua disponível mesmo após recriar o container.
      - prisma_data:/app/prisma/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: always

volumes:
  prisma_data:
